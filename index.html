<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ceroa</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:  #111111;
      --gold:   #c9a84c;
      --gold-d: #a8872e;
      --text:   #222222;
      --muted:  #666666;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #ffffff;
      color: var(--text);
      min-height: 100vh;
    }

    #homePage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    .home-logo {
      width: min(340px, 72vw);
      margin-bottom: 52px;
    }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #ffffff;
      border: 1.5px solid #e0ddd7;
      border-radius: 12px;
      padding: 16px 20px;
      cursor: pointer;
      text-align: left;
      transition: box-shadow .18s, border-color .18s, transform .12s;
      text-decoration: none;
      color: var(--text);
      width: min(320px, 90vw);
    }
    .tool-btn:hover {
      box-shadow: 0 4px 18px rgba(0,0,0,.10);
      border-color: var(--gold);
      transform: translateY(-1px);
    }
    .tool-btn:active { transform: translateY(0); }

    .tool-icon {
      width: 42px;
      height: 42px;
      background: var(--black);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
      color: var(--gold);
    }

    .tool-label { font-size: 1rem; font-weight: bold; color: var(--black); }
    .tool-sub   { font-size: .78rem; color: var(--muted); margin-top: 2px; font-style: italic; }

    .home-footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      text-align: center;
      padding: 14px;
      font-size: .75rem;
      color: #bbb;
      background: #fff;
      border-top: 1px solid #f0ede8;
    }
  </style>
</head>
<body>

<div id="homePage">
  <img src="Ceroa Logo.png" alt="Ceroa" class="home-logo" />

  <a class="tool-btn" href="ab-price-tool.html">
    <div class="tool-icon">&#128717;</div>
    <div>
      <div class="tool-label">AB Price Tool</div>
      <div class="tool-sub">Compare book prices across the web</div>
    </div>
  </a>

  <a class="tool-btn" href="ja-lesson-plan/index.html">
    <div class="tool-icon">&#128218;</div>
    <div>
      <div class="tool-label">JA Lesson Plan Tool</div>
      <div class="tool-sub">Teacher activity planner for John's Academy</div>
    </div>
  </a>

  <div class="home-footer">&copy; Ceroa</div>
</div>

</body>
</html>
